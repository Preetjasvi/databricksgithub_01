# This is a Declarative Automation Bundle definition for DAB_newdemo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_newdemo
  uuid: 9be60758-c13f-40ef-bb14-a0cbd69032d7

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-847c809a-ea73.cloud.databricks.com
    variables:
      catalog: postgresqlvolume
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-847c809a-ea73.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/preetisjatti@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/preetisjatti@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: postgresqlvolume
      schema: prod
    permissions:
      - user_name: preetisjatti@gmail.com
        level: CAN_MANAGE
