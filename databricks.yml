# This is a Declarative Automation Bundle definition for DAB_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_demo
  uuid: 328883fd-4e6c-4d13-97ad-0a1a120b1358

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-847c809a-ea73.cloud.databricks.com
    variables:
      catalog: learn_database
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-847c809a-ea73.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/preetisjatti@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/preetisjatti@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: learn_database
      schema: prod
    permissions:
      - user_name: preetisjatti@gmail.com
        level: CAN_MANAGE
